name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install uv==0.9.26
      - run: uv sync --locked
      - run: uv run --locked pytest -q
      - run: uv run --locked ruff check src tests examples .githooks .repo-safety/scripts
      - run: uv run --locked python .repo-safety/scripts/forbid_sensitive_files.py --all
      - run: uv run --locked python examples/demo.py
      - run: uv build
