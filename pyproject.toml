[project]
name = "jira-flow-report"
version = "0.1.0"
description = "Configurable Jira flow reports with offline HTML and reproducible issue exports"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6.0.2,<7", "python-dotenv>=1.1,<2", "tzdata>=2025.1"]

[project.scripts]
jira-flow = "jira_flow.cli:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "jira_flow"
source-include = ["configs/example.yaml", "tests/**", ".githooks/**", ".repo-safety/**", "AGENTS.md", ".env.example", ".gitattributes", ".gitignore"]
source-exclude = [".repo-safety/reports/**", ".repo-safety/logs/**"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
